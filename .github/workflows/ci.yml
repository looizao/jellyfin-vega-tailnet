name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and native smoke test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.5
          cache-dependency-path: third_party/libtailscale/go.sum

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Run checks
        run: npm run verify

  vpkg:
    name: Build ARMv7 VPKG
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.5
          cache-dependency-path: third_party/libtailscale/go.sum

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y curl jq lz4 python3-dev

      - name: Install pinned Vega SDK
        run: |
          bash scripts/install-vega-sdk.sh
          echo "$HOME/vega/bin" >> "$GITHUB_PATH"

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Build release package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          source "$HOME/vega/env"
          npm run build:release

      - name: Validate package
        run: |
          source "$HOME/vega/env"
          vpkg="$(find build/armv7-release -name '*.vpkg' -type f -print -quit)"
          test -n "$vpkg"
          vega exec vpt validate "$vpkg"
          vega exec vpt info "$vpkg" --json

      - name: Upload ARMv7 package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tailvega-armv7-${{ github.sha }}
          path: build/armv7-release/*.vpkg
          if-no-files-found: error
          retention-days: 14
