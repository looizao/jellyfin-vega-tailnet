name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    name: Publish verified preview release
    runs-on: ubuntu-22.04
    needs: checks
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
      - name: Download the artifacts built by this release run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: gh run download "$RUN_ID" --name "jellyvega-armv7-$COMMIT" --dir dist
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "JellyVega $RELEASE_TAG (device testing preview)" --notes-file docs/RELEASE_NOTES.md
